name: Project Maze CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein laufender Check pro Branch reicht; ältere Läufe werden abgebrochen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify project
        run: npm run check

      - name: Balance report
        run: npm run balance | tee balance-report.txt

      - name: Upload balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-${{ github.run_number }}
          path: balance-report.txt
          if-no-files-found: error
          retention-days: 30

  deployment:
    name: Deployment images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: false
          load: false
          build-args: |
            VITE_WS_URL=
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Validate compose stack
        run: docker compose config --quiet
