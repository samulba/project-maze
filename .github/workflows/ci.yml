name: Project Maze CI

#
# PAUSIERT (14.08., Sam): Die GitHub-Actions-Minuten des Accounts sind
# aufgebraucht – jeder Job startet seit Tagen ohne zugewiesenen Runner und
# scheitert in Sekunden (0 ms abgerechnete Zeit, siehe Actions-Log), meldet
# das aber trotzdem als "failed" per E-Mail. Bei jedem Push (auch von
# parallel laufenden Sessions) kam dadurch etwa alle drei Minuten eine
# Fehler-Mail, ohne dass irgendein Job je wirklich lief.
#
# `push`/`pull_request` deshalb entfernt, nur `workflow_dispatch` bleibt
# (manuell über den "Run workflow"-Knopf im Actions-Tab). Sobald das
# Kontingent wieder da ist: `push:`-Block unten wieder einkommentieren
# (Inhalt unverändert stehen gelassen) – und dabei gleich klären, ob
# wirklich alle drei Jobs (verify/Deployment images/Kommt der Stand live
# an?) gebraucht werden oder ob die Hosting-Plattform manches schon selbst
# abdeckt.
#
# on:
#   push:
#     branches: [main]
#     # Reine Doku-Pushes lassen den Dienst unberührt – sie brauchen weder
#     # Testlauf noch Image-Bau noch Deploy-Wache. Nachgezählt an den letzten
#     # 30 Commits auf main: 12 hätten hier gar keinen Lauf mehr ausgelöst,
#     # 2 weitere (scripts/, .github/) lösen einen Lauf aus, dessen Wache
#     # sofort grün ist, 16 tragen echten Code. Enthält ein Push AUCH Code,
#     # greift der Filter nicht und die CI läuft vollständig – GitHub prüft
#     # alle Dateien des Pushes, nicht nur die des letzten Commits.
#     paths-ignore:
#       - 'docs/**'
#       - 'supabase/**'
#       - '**/*.md'
#       - '.gitignore'
#   pull_request:
on:
  workflow_dispatch:

# Ein laufender Check pro Branch reicht; ältere Läufe werden abgebrochen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify project
        run: npm run check

      - name: Balance report
        run: npm run balance | tee balance-report.txt

      - name: Upload balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-${{ github.run_number }}
          path: balance-report.txt
          if-no-files-found: error
          retention-days: 30

  deployment:
    name: Deployment images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: false
          load: false
          build-args: |
            VITE_WS_URL=
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Validate compose stack
        run: docker compose config --quiet

  # Ein grüner Push ist kein Beweis, dass der Stand live ist. Am 05.08. blieb
  # der Auto-Deploy stehen und zwölf Commits lang merkte es niemand – dieser
  # Job hätte beim ersten davon Alarm geschlagen.
  #
  # Läuft nur nach einem Push auf main (nur der wird deployt) und hängt an
  # keinem anderen Job: Schlägt er fehl, ist die Aussage „der Stand ist nicht
  # live", nicht „der Code ist kaputt".
  deploy-watch:
    name: Kommt der Stand live an?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volle Historie: Die Wache sucht per `git log` den jüngsten Commit,
          # der etwas Deploybares anfasst (scripts/deploy-scope.mjs). Im
          # flachen Standard-Klon (Tiefe 1) findet sie nur den Push selbst und
          # fällt auf das alte, zu strenge Verhalten zurück.
          fetch-depth: 0

      - name: Auf den erwarteten Commit in /health warten
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          # Über eine Repository-Variable umstellbar, ohne die Datei zu ändern.
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://www.mazers.de/health' }}
          TIMEOUT_SECONDS: '900'
        run: node scripts/deploy-watch.mjs
