<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Ein Admin-Portal gehört in keinen Suchindex. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>MAZERS · Zentrale</title>
    <!--
      Vorher stand hier `/favicon.svg` – eine Datei, die es im Projekt nie gab.
      Das kostete bei jedem Aufruf des Portals einen 404. Dieselben Symbole wie
      im Spiel (`index.html`), damit der Tab erkennbar zu MAZERS gehört.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f7f9" />
    <!--
      Der Grundton steht im Dokument und nicht erst im Stylesheet, damit
      zwischen erstem Anstrich und geladenem CSS nichts aufblitzt.
    -->
    <style>html{background:#f6f7f9;color-scheme:light}</style>
  </head>
  <body class="admin">
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
