server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Der Client ist eine reine Static-Bundle-App; Uploads gibt es nicht.
  client_max_body_size 1m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  # ── Passwort-Tor ───────────────────────────────────────────────────────────
  # Der Node-Server hat ein eigenes Tor (apps/server/src/site-gate.ts). Alles,
  # was nginx an ihn weiterreicht (/ws, /health, /admin/api/), läuft ohnehin
  # dort hindurch. Was nginx aber SELBST ausliefert – das Client-Bundle, die
  # Assets, admin.html – sieht der Node-Prozess nie. Genau diese Dateien wären
  # im Compose-Stack ohne die folgenden Zeilen frei zugänglich.
  #
  # Das Passwort steht deshalb nicht hier: nginx fragt für jede solche Anfrage
  # beim Server nach (`auth_request`). Eine Wahrheit, ein Ort – ein Passwort in
  # zwei Konfigurationen läuft früher oder später auseinander.
  location = /gate/_check {
    internal;
    proxy_pass http://${MAZE_SERVER_UPSTREAM}/gate/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Die Tür selbst (Login-Seite, Formular, Abmelden) muss ohne Cookie
  # erreichbar sein – sonst käme niemand je hinein.
  location /gate {
    proxy_pass http://${MAZE_SERVER_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Wer ohne gültiges Cookie an eine gesperrte Datei kommt, landet an der Tür.
  #
  # Nur 401, ausdrücklich nicht 403: `/gate/check` antwortet ausschließlich mit
  # 204 oder 401, also ist 401 hier immer „kein Cookie". Ein 403 hat mit dem
  # Tor nichts zu tun – das ist nginx, der eine Datei nicht lesen darf. Beim
  # Testlauf hat genau das eine kaputte Dateiberechtigung als „bitte einloggen"
  # getarnt, und die Fehlersuche ging in die falsche Richtung.
  error_page 401 = @zur_tuer;
  location @zur_tuer {
    add_header Cache-Control "no-store" always;
    return 302 /gate;
  }

  # Gehashte Vite-Assets sind unveränderlich, index.html darf nie gecacht werden.
  location /assets/ {
    auth_request /gate/_check;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    auth_request /gate/_check;
    add_header Cache-Control "no-store";
  }

  # WebSocket-Upgrade zum autoritativen Spielserver (VITE_WS_URL=.../ws).
  location /ws {
    proxy_pass http://${MAZE_SERVER_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Uptime-Check des Servers über denselben Origin. /metrics wird bewusst
  # nicht durchgereicht – Telemetrie bleibt im internen Netz.
  location = /health {
    proxy_pass http://${MAZE_SERVER_UPSTREAM}/health;
    proxy_set_header Host $host;
  }

  # Admin-Portal. Ohne diese drei Regeln fiele /admin in den SPA-Rückfall unten
  # und zeigte das Spiel statt des Portals – und /admin/api/* bekäme HTML statt
  # JSON zurück. Nur der Compose-Pfad braucht das; auf Railway liefert der
  # Node-Server selbst aus und kennt die Route bereits.
  location = /admin {
    auth_request /gate/_check;
    try_files /admin.html =404;
  }
  location = /admin.html {
    auth_request /gate/_check;
    add_header Cache-Control "no-store";
  }
  location /admin/api/ {
    proxy_pass http://${MAZE_SERVER_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    auth_request /gate/_check;
    try_files $uri $uri/ /index.html;
  }
}
