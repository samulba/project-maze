server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Der Client ist eine reine Static-Bundle-App; Uploads gibt es nicht.
  client_max_body_size 1m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  # Gehashte Vite-Assets sind unveränderlich, index.html darf nie gecacht werden.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # WebSocket-Upgrade zum autoritativen Spielserver (VITE_WS_URL=.../ws).
  location /ws {
    proxy_pass http://${MAZE_SERVER_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Uptime-Check des Servers über denselben Origin. /metrics wird bewusst
  # nicht durchgereicht – Telemetrie bleibt im internen Netz.
  location = /health {
    proxy_pass http://${MAZE_SERVER_UPSTREAM}/health;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
